<style>
  :root{ --bg:#0A0A0A; --ink:#F4F1EA; --accent:#EAF200; --line:#2a2a24; --err:#FF6B57; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{width:100%;max-width:380px}
  .mark{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--accent);margin:0 0 14px}
  h1{font-size:clamp(24px,7vw,30px);font-weight:900;letter-spacing:.02em;margin:0 0 8px;line-height:1.3}
  .sub{font-size:13px;line-height:1.9;color:#9a9a90;margin:0 0 28px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:#9a9a90;margin:0 0 8px}
  input{width:100%;background:#141410;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:13px 14px;font:inherit;font-size:16px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:14px;background:var(--accent);color:#0A0A0A;border:0;
    border-radius:8px;padding:14px;font:inherit;font-size:15px;font-weight:900;letter-spacing:.06em;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--err)}
  .msg.busy{color:#9a9a90}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <p class="mark">MOMENTUM Inc.</p>
    <h1>関係者限定ページ</h1>
    <p class="sub">パスワードを入力すると会社概要が表示されます。</p>
    <form id="f" autocomplete="off">
      <label for="pw">PASSWORD</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button id="go" type="submit">表示する</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
